    <path d="M 24 14 L 35 14 L 35 16 L 24 16 Z" fill="url(#hb-orange-accent)" />
    <path d="M 24 52 L 35 52 L 35 54 L 24 54 Z" fill="url(#hb-orange-accent)" />

