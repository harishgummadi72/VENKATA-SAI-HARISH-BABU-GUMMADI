  </defs>
  <rect width="64" height="64" rx="14" fill="#080808" stroke="#262626" stroke-width="2" />
  <g transform="translate(1, -2)">
    <!-- H Left Stem -->
    <rect x="12" y="14" width="6" height="40" fill="url(#hb-orange-primary)" rx="0.5" />
    <path d="M 8 14 L 22 14 L 22 16 L 8 16 Z" fill="url(#hb-orange-primary)" />
    <path d="M 8 52 L 22 52 L 22 54 L 8 54 Z" fill="url(#hb-orange-primary)" />

